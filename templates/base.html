<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ITI Exam System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block styles %}{% endblock %}
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-2 sidebar p-3 d-flex flex-column">
            <div class="mb-4 pb-3 border-bottom border-secondary">
                <h4 class="sidebar-brand mb-1">ITI Exam System</h4>
                <small class="text-secondary">{% block portal_label %}Portal{% endblock %}</small>
            </div>
            {% block sidebar %}{% endblock %}
            <div class="mt-auto pt-3 border-top border-secondary">
                <a href="/" class="nav-link text-danger">⏻ Logout</a>
            </div>
        </div>
        <div class="col-md-10 main-content d-flex flex-column" style="height: 100vh;">
            <header class="top-header d-flex align-items-center justify-content-between px-4 shadow-sm">
                <h5 class="m-0 text-secondary">{% block header %}Dashboard{% endblock %}</h5>
            </header>
            <main class="p-4 flex-grow-1 overflow-auto" id="mainContent">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
