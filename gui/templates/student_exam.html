{% extends "base.html" %}
{% block content %}
<input type="hidden" id="studentExamId" value="{{ student_exam_id }}">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Database Fundamentals Exam</h2>
    <span class="badge bg-primary fs-6">Time: 45:00</span>
</div>

<form id="examForm">
    <div class="card p-4 mb-4 question-card" data-question-id="101">
        <h5>1. What does ACID stand for?</h5>
        <div class="form-check mt-3">
            <input class="form-check-input answer-radio" type="radio" name="q1" value="401"> Atomicity, Consistency, Isolation, Durability
        </div>
        <div class="form-check">
            <input class="form-check-input answer-radio" type="radio" name="q1" value="402"> Automatic, Consistent, Isolated, Durable
        </div>
    </div>

    <div class="text-end">
        <div id="msg" class="alert d-none text-start"></div>
        <button type="submit" class="btn btn-primary px-5">Submit JSON Answers</button>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
$('#examForm').submit(function(e) {
    e.preventDefault();
    let answers = [];
    $('.answer-radio:checked').each(function() {
        answers.push({
            "question_id": $(this).closest('.question-card').data('question-id'),
            "chosen_option_id": $(this).val()
        });
    });

    $.ajax({
        url: '/api/submit_exam', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({ student_exam_id: $('#studentExamId').val(), answers: answers }),
        success: function(res) {
            $('#msg').removeClass('d-none alert-danger').addClass('alert-success').text(res.message);
        }
    });
});
</script>
{% endblock %}
