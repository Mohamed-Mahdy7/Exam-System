{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Instructor Dashboard</h2>
<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card p-4 h-100">
            <h4>Generate Exam</h4>
            <form>
                <input type="number" class="form-control mb-2" placeholder="Course ID">
                <input type="text" class="form-control mb-2" placeholder="Exam Name">
                <div class="d-flex gap-2 mb-3">
                    <input type="number" class="form-control" placeholder="Num MCQ">
                    <input type="number" class="form-control" placeholder="Num T/F">
                </div>
                <button type="button" class="btn btn-primary w-100">Call GenerateExam()</button>
            </form>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card p-4 h-100">
            <h4>Mandatory Reports</h4>
            <p class="text-muted">Generates PDF via Python fpdf</p>
            <div class="d-grid gap-2">
                <a href="/api/reports/students_by_dept/1" class="btn btn-outline-primary text-start">📄 Report: Students By Department</a>
                <button class="btn btn-outline-primary text-start">📄 Report: Student Grades</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
